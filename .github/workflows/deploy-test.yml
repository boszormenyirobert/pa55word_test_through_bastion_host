name: Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deploy
    runs-on: ubuntu-latest

    environment: production

    steps:

      # ======================================
      # STEP 1 - Prepare SSH environment
      # ======================================

      - name: Prepare SSH environment
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh


      # ======================================
      # STEP 2 - Install SSH private keys
      # ======================================
      

      - name: Install SSH keys
        env:
          BASTION_SSH_KEY: ${{ secrets.BASTION_PRIVATE_DEPLOY }}
          PA55WORD_SSH_KEY: ${{ secrets.PA55WORD_PRIVATE_DEPLOY }}
        run: |
          mkdir -p ~/.ssh
      
          printf '%s' "$BASTION_SSH_KEY" | tr -d '\r' > ~/.ssh/bastion_key
          printf '%s' "$PA55WORD_SSH_KEY" | tr -d '\r' > ~/.ssh/PA55WORD_key
      
          chmod 600 ~/.ssh/bastion_key
          chmod 600 ~/.ssh/PA55WORD_key
      
          echo "Key size:"
          wc -c < ~/.ssh/bastion_key
      
          echo "First line:"
          head -n 1 ~/.ssh/bastion_key
      
          echo "Last line:"
          tail -n 1 ~/.ssh/bastion_key
      
          echo "Testing key:"
          ssh-keygen -y -f ~/.ssh/bastion_key > /dev/null
          ssh-keygen -y -f ~/.ssh/PA55WORD_key > /dev/null
      
          echo "KEY IS VALID"


      - name: Validate SSH keys
        run: |
          echo "Checking Bastion key..."
          ssh-keygen -y -f ~/.ssh/bastion_key > /dev/null
      
          echo "Checking PA55WORD key..."
          ssh-keygen -y -f ~/.ssh/PA55WORD_key > /dev/null
      
          echo "Both SSH keys are valid!"

      # ======================================
      # STEP 3 - Configure SSH known hosts
      # ======================================

      - name: Configure SSH known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

        run: |
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      # ======================================
      # STEP 4 - Configure SSH connections
      # ======================================

      - name: Configure SSH
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ${{ secrets.BASTION_USER }}
          PA55WORD_HOST: ${{ secrets.PA55WORD_HOST }}
          PA55WORD_USER: ${{ secrets.PA55WORD_USER }}

        run: |
          cat > ~/.ssh/config <<EOF

          Host bastion
            HostName ${BASTION_HOST}
            User ${BASTION_USER}
            IdentityFile ~/.ssh/bastion_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts

          Host PA55WORD
            HostName ${PA55WORD_HOST}
            User ${PA55WORD_USER}
            ProxyJump bastion
            IdentityFile ~/.ssh/PA55WORD_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts

          EOF

          chmod 600 ~/.ssh/config

      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.BASTION_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      
      - name: Test Bastion connection
        run: |
          ssh bastion "echo 'Bastion connection successful'"
          
      # ======================================
      # STEP 5 - Test Bastion connection
      # ======================================

      - name: Test Bastion connection
        run: |
          ssh bastion "echo 'Bastion connection successful'"


      # ======================================
      # STEP 6 - Test PA55WORD connection
      # ======================================

      - name: Test PA55WORD connection
        run: |
          ssh PA55WORD "echo 'PA55WORD connection successful'"


      # ======================================
      # STEP 7 - Deploy application
      # ======================================

      - name: Deploy application
        run: |
          ssh PA55WORD <<'EOF'

            set -e

            cd /opt/application

            echo "Starting deployment..."

            git fetch origin main

            git reset --hard origin/main

            docker compose up -d --build

            echo "Deployment completed!"

          EOF


      # ======================================
      # STEP 8 - Verify deployment
      # ======================================

      - name: Verify deployment
        run: |
          ssh PA55WORD <<'EOF'

            set -e

            cd /opt/application

            docker compose ps

            echo "Production deployment verified successfully!"

          EOF
